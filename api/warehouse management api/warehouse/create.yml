info:
  name: create warehouse
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/warehouse/"
  body:
    type: json
    data: |-
      {
        "code": "WH-001",
        "name": "Main warehouse",
        "address": "Warehouse address",
        "status": "ACTIVE"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
