info:
  name: create permission
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/permission/"
  body:
    type: json
    data: |-
      {
        "resource": "warehouse",
        "action": "read",
        "description": "Read warehouse records"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
